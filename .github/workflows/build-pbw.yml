# Builds the Trekv4 PBW and (optionally) publishes it as a tagged GitHub release.
#
# Releases are cut manually for now: Actions -> "Build PBW" -> Run workflow.
# The release version is NOT an input - it is read from package.json's "version"
# (the app definition the Pebble SDK stamps into the PBW), and the tag is v<version>.
# Bump package.json (and package-lock.json) before running; the job refuses to
# overwrite an existing tag.
#
# Pre-releases: set the "prerelease" input (e.g. rc1) to publish v<version>-rc1 as
# a GitHub pre-release titled "Release Candidate 1". The suffix lives only on the
# tag, title and file name - the SDK rejects it in package.json, so the PBW itself
# still reports <version>.
#
# Release notes, first match wins:
#   1. .github/release-notes/<tag>.md, then .github/release-notes/v<version>.md
#      (hand-written; the second covers every rc of a version and its final).
#   2. A Claude-drafted summary of the commits and diff since the previous release
#      (.github/scripts/release-notes.mjs), when the ANTHROPIC_API_KEY secret is set.
#   3. Nothing extra.
# GitHub's generated notes (contributors, full-changelog link) are appended to all
# three. The notes are shown in the run summary even when "release" is unchecked,
# so a dry run previews them.

name: Build PBW

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create the v<package.json version> tag and GitHub release"
        type: boolean
        default: true
      prerelease:
        description: "Pre-release suffix: rcN, betaN or alphaN (e.g. rc1). Leave empty for a final release."
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: build-pbw-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in step with README.md "Prerequisites" - the verified tool/SDK pair.
  PEBBLE_TOOL_VERSION: "5.0.39"
  PEBBLE_SDK_VERSION: "4.17"
  PYTHON_VERSION: "3.13"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history and tags: the notes step diffs against the previous release.
          fetch-depth: 0

      - name: Read app version
        id: version
        env:
          SUFFIX: ${{ inputs.prerelease }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          release="$version"
          title="Trekv4 v$version"
          if [ -n "$SUFFIX" ]; then
            if ! [[ "$SUFFIX" =~ ^(rc|beta|alpha)([1-9][0-9]*)$ ]]; then
              echo "::error::prerelease '$SUFFIX' must look like rc1, beta2 or alpha3"
              exit 1
            fi
            case "${BASH_REMATCH[1]}" in
              rc) stage="Release Candidate" ;;
              beta) stage="Beta" ;;
              alpha) stage="Alpha" ;;
            esac
            release="$version-$SUFFIX"
            title="Trekv4 v$release ($stage ${BASH_REMATCH[2]})"
            echo "stage=$stage ${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=v$release" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "Building $title"

      - name: Refuse to reuse an existing release tag
        if: inputs.release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Bump \"version\" in package.json (or the prerelease suffix) first."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Cache Pebble SDK
        uses: actions/cache@v4
        with:
          path: ~/.pebble-sdk/SDKs
          key: pebble-sdk-${{ env.PEBBLE_SDK_VERSION }}-${{ runner.os }}

      - name: Install Pebble tool and SDK
        run: |
          uv tool install "pebble-tool==${PEBBLE_TOOL_VERSION}" --python "${PYTHON_VERSION}"
          if [ ! -d "$HOME/.pebble-sdk/SDKs/${PEBBLE_SDK_VERSION}" ]; then
            pebble sdk install "${PEBBLE_SDK_VERSION}"
          fi
          pebble sdk activate "${PEBBLE_SDK_VERSION}"
          pebble --version

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: |
          npm run check
          python3 make_shim.py --check
          npm test

      - name: Build PBW
        run: pebble build

      - name: Stage artifact
        id: stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          built=$(ls build/*.pbw)
          label=$(unzip -p "$built" appinfo.json | node -e \
            "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).versionLabel))")
          if [ "$label" != "$VERSION" ]; then
            echo "::error::PBW versionLabel '$label' does not match package.json '$VERSION'"
            exit 1
          fi
          mkdir -p dist
          cp "$built" "dist/trekv4-v${RELEASE}.pbw"
          echo "pbw=dist/trekv4-v${RELEASE}.pbw" >> "$GITHUB_OUTPUT"

      - name: Upload PBW artifact
        uses: actions/upload-artifact@v4
        with:
          name: trekv4-v${{ steps.version.outputs.release }}
          path: ${{ steps.stage.outputs.pbw }}
          if-no-files-found: error

      - name: Prepare release notes
        id: notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          STAGE: ${{ steps.version.outputs.stage }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          body="$RUNNER_TEMP/release-body.md"
          : > "$body"
          source="none"
          for f in ".github/release-notes/$TAG.md" ".github/release-notes/v$VERSION.md"; do
            if [ -f "$f" ]; then
              cp "$f" "$body"
              source="$f"
              break
            fi
          done
          if [ "$source" = "none" ] && [ -n "$ANTHROPIC_API_KEY" ]; then
            # Installed outside the project so the watchface's package.json stays untouched.
            ai="$RUNNER_TEMP/release-notes-ai"
            mkdir -p "$ai"
            cp .github/scripts/release-notes.mjs "$ai/"
            if npm install --prefix "$ai" --no-save --no-audit --no-fund @anthropic-ai/sdk@0.128.0 >/dev/null \
              && NOTES_OUT="$body" node "$ai/release-notes.mjs"; then
              source="Claude"
            else
              echo "::warning::AI release notes failed; publishing GitHub's generated notes only"
              : > "$body"
            fi
          fi
          {
            if [ -n "$STAGE" ]; then
              echo "> [!IMPORTANT]"
              echo "> **$STAGE** of Trekv4 $VERSION. This is a pre-release for testing; please report any problems in Issues."
              echo
            fi
            cat "$body"
          } > "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"
          echo "Release notes source: $source"
          {
            echo "## Release notes preview ($TAG)"
            echo
            echo "_Source: ${source}. GitHub's generated notes are appended on publish._"
            echo
            cat "$notes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create tag and release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
          PBW: ${{ steps.stage.outputs.pbw }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          # With --notes-file, --generate-notes appends GitHub's notes after ours.
          args=(--target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" --generate-notes)
          if [ -n "$PRERELEASE" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "$PBW" "${args[@]}"
